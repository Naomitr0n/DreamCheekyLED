name: Build Release Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to build (e.g. v1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Tagged Version
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish Console Application
        run: >
          dotnet publish
          DreamCheekyLED/DreamCheekyPathLoaderApp/DreamCheekyPathLoaderApp.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugSymbols=false
          --output ./publish

      - name: Remove Unnecessary Documentation and Symbols
        run: |
          Get-ChildItem -Path ./publish -Recurse -File -Include *.pdb,*.xml |
            Remove-Item -Force

      - name: Upload Release Package
        uses: actions/upload-artifact@v4
        with:
          name: DreamCheekyPathLoaderApp-${{ inputs.release_tag }}-win-x64
          path: ./publish/*.exe
          retention-days: 14